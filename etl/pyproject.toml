[project]
name = "wardmap"
version = "0.1.0"
description = "ETL for the Cape Town ward accountability map"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "shapely>=2.1",
    "pyproj>=3.6",
    "pandas>=2.2",
    "pdfplumber>=0.11",
    "rasterio>=1.5.2",
    "python-calamine>=0.9.1",
    "pyyaml>=6.0.3",
    "pyshp>=3.1.9",
    "truststore>=0.10.5",
]

[project.scripts]
wardmap = "wardmap.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wardmap"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # the formatter owns line length; long strings stay readable

[tool.pytest.ini_options]
testpaths = ["tests"]
