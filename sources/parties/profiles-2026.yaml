      date: "2026-10-20"
    positions:
      lgbtq:
        summary: "Party leader Jacob Zuma criticised the legal recognition of same-sex relationships at an MK rally."
        quote: "Who made the law that a man can date another man? Who will women be left with?"
        url: "https://www.timeslive.co.za/politics/2024-02-26-listen-jacob-zumas-homophobic-remarks-at-mk-rally/"
        date: "2024-02-25"
        source_type: "leader_statement"
      human_rights:
        summary: "Manifesto says restoring public order must not compromise the rule of law or human dignity; calls basic services human rights."
        quote: "MK municipalities will restore public order and rebuild shared spaces without compromising the rule of law or human dignity."
        url: "https://www.polity.org.za/article/mkp-the-peoples-mandate-2026-local-government-election-2026-10-20"
        date: "2026-10-20"
        source_type: "manifesto"
      israel_palestine:
        summary: "Stands with Palestinians and Lebanese against what it calls Israeli expansionism; calls for ceasefire and pressure on Israel."
        quote: "the MK Party stands in solidarity with the people of Lebanon and Palestine, who have long suffered under the brutal policies of Israeli expansionism"
        url: "https://politicsweb.co.za/archive/planned-israeli-ground-invasion-of-lebanon-condemn"
        date: "2024-09-29"
        source_type: "party_statement"
      policing:
        summary: "Strengthen municipal policing, traffic and by-law enforcement; cooperate with SAPS against cable theft and construction disruption."
        quote: "strengthen municipal policing, traffic enforcement and by-law enforcement."
        url: "https://www.polity.org.za/article/mkp-the-peoples-mandate-2026-local-government-election-2026-10-20"
        date: "2026-10-20"
        source_type: "manifesto"
      housing_land:
        summary: "Change land ownership and contract beneficiaries; upgrade informal settlements in place; release well-located public land."
        quote: "Radical economic transformation means changing who owns the land and who receives municipal contracts."
        url: "https://www.polity.org.za/article/mkp-the-peoples-mandate-2026-local-government-election-2026-10-20"
        date: "2026-10-20"
        source_type: "manifesto"
      immigration:
        summary: "Enforce immigration and employment laws, act against employers of undocumented workers, reserve some service jobs for citizens."
        quote: "MKP municipalities will enforce immigration and employment laws, act against employers who exploit undocumented workers, and reserve designated service-industry opportunities for South African citizens."
        url: "https://www.polity.org.za/article/mkp-the-peoples-mandate-2026-local-government-election-2026-10-20"
        date: "2026-10-20"
        source_type: "manifesto"

