# Draft dataset: South African party priorities and positions, 2026 local government elections context.
# Compiled 2026-11-17 (researched with an AI agent; every quote checked against its source text). Only the party's own words (manifesto, statements, leader/spokesperson quotes).
# Polity.org.za article URLs host the party's own manifesto PDFs (download link on the page); they block
# some automated fetchers but open normally in a browser.
# Dates are document/statement dates. Where a manifesto launch date was not confirmed, the hosting/publication
# date is used and flagged in a comment.

parties:

  - name: "Democratic Alliance"
    website: "https://www.da.org.za"
    manifesto:
      title: "Getting South Africa Working for All: Local Government Manifesto 2026"
      url: "https://www.da.org.za/policy/2026-local-government-manifesto"
      date: "2026-08-08"   # national launch, Mary Fitzgerald Square, Johannesburg
      election: "2026 local"
    priorities:
      - text: "End cadre deployment; appoint municipal staff on merit to build corruption-free, professional administrations."
        url: "https://www.polity.org.za/article/da-local-government-manifesto-2026-2026-08-11"
      - text: "Reinvest water revenue into water infrastructure, fix leaks, and use private-sector investment and expertise."
        url: "https://www.polity.org.za/article/da-local-government-manifesto-2026-2026-08-11"
      - text: "Reinvest electricity revenue into grids and let municipalities buy and sell their own power."
        url: "https://www.polity.org.za/article/da-local-government-manifesto-2026-2026-08-11"
      - text: "Bring policing closer to residents by devolving policing powers and budget to capable municipalities."
        url: "https://www.polity.org.za/article/da-local-government-manifesto-2026-2026-08-11"
      - text: "Restore neglected public spaces and waste collection, partnering with communities and the private sector."
        url: "https://www.polity.org.za/article/da-local-government-manifesto-2026-2026-08-11"
      - text: "Grow jobs by cutting red tape, supporting informal traders, releasing land and delivering title deeds."
        url: "https://www.polity.org.za/article/da-local-government-manifesto-2026-2026-08-11"
    economy:
      summary: "Ring-fence and reinvest water and electricity revenue, use public-private partnerships for infrastructure, let municipalities buy/sell power, cost-reflective tariffs."
      url: "https://www.polity.org.za/article/da-local-government-manifesto-2026-2026-08-11"
      date: "2026-08-08"
    positions:
      lgbtq:
        summary: "Called on government to show commitment to protecting LGBTQI+ people, including from homophobic attacks on visitors."
        quote: "protecting the rights of all people, particularly vulnerable and minority groups like the LGBTQI+ community"
        url: "https://www.da.org.za/2022/06/international-pride-month-time-for-the-government-to-focus-on-lgbtqi-tourism"
        date: "2022-06-17"
        source_type: "party_statement"
      human_rights:
        summary: "Opposed the Hate Crimes and Hate Speech Bill as drafted, saying it would chill freedom of speech."
        quote: "If the issues identified in the Bill are not addressed during the legislative process, this Bill will have a chilling effect on freedom of speech."
        url: "https://www.da.org.za/2021/10/hate-speech-bill-will-undermine-freedom-of-speech"
        date: "2021-10-05"
        source_type: "party_statement"
      israel_palestine:
        summary: "Supports a negotiated two-state solution with a sovereign Palestine beside a secure Israel; rejected Netanyahu's opposition to Palestinian statehood."
        quote: "a two-state solution that results in the creation of a sovereign and unoccupied Palestine co-existing in peace next to a secure Israel"
        url: "https://www.da.org.za/2024/01/the-da-rejects-netanyahus-recent-statements"
        date: "2024-01-19"
        source_type: "party_statement"
      policing:
        summary: "Wants policing powers, budget and investigative powers devolved to capable municipalities, plus more technology and partnerships."
        quote: "We will make communities safer by bringing policing closer to the people."
        url: "https://www.polity.org.za/article/da-local-government-manifesto-2026-2026-08-11"
        date: "2026-08-08"
        source_type: "manifesto"
      housing_land:
        summary: "Release unused state land for affordable, medium-density housing; deliver title deeds; overhaul housing allocation for transparency."
        quote: "Releasing unutilised state-owned land parcels for housing developments."
        url: "https://www.polity.org.za/article/da-local-government-manifesto-2026-2026-08-11"
        date: "2026-08-08"
        source_type: "manifesto"
      immigration:
        summary: "Backs the Home Affairs White Paper: first-safe-country asylum rule, points-based skilled immigration, tougher enforcement against illegal immigration."
        quote: "make it easy for investors, tourists, and skilled individuals to enter legally, and hard for illegal immigration and abuse"
        url: "https://www.da.org.za/2026/04/da-affirms-minister-schreibers-plan-to-end-illegal-immigration"
        date: "2026-04-16"
        source_type: "party_statement"

  - name: "African National Congress"
    website: "https://www.anc1912.org.za"
    manifesto:
      title: "ANC 2026 Local Government Manifesto: A Better Life for All - Let Us Continue Building Better Communities, Together"
      url: "https://www.polity.org.za/article/anc-2026-local-government-manifesto-2026-08-24"
      date: "2026-08-23"   # launch reported as scheduled for 23 Aug (Diepsloot); Polity posted 24 Aug. Confirm.
      election: "2026 local"
    priorities:
      - text: "Reliable, quality and affordable basic services and infrastructure, including roads, water and human settlements."
        url: "https://www.polity.org.za/article/anc-2026-local-government-manifesto-2026-08-24"
      - text: "Economic development and jobs, prioritising South African workers and businesses in municipal opportunities."
        url: "https://www.polity.org.za/article/anc-2026-local-government-manifesto-2026-08-24"
      - text: "Safe, clean, healthy and resilient communities through Community Safety Forums and stronger by-law enforcement."
        url: "https://www.polity.org.za/article/anc-2026-local-government-manifesto-2026-08-24"
      - text: "Sustainable municipal finances: billing audits, fair tariffs, automatic indigent registration for grant recipients."
        url: "https://www.polity.org.za/article/anc-2026-local-government-manifesto-2026-08-24"
      - text: "Capable developmental local government with zero tolerance for corruption."
        url: "https://www.polity.org.za/article/anc-2026-local-government-manifesto-2026-08-24"
      - text: "Community participation, with councillors reporting regularly to residents against measurable targets."
        url: "https://www.polity.org.za/article/anc-2026-local-government-manifesto-2026-08-24"
    economy:
      summary: "Keep tariffs fair and reduce reliance on above-inflation increases; protect free basic services; use DBSA and PPPs where appropriate."
      url: "https://www.polity.org.za/article/anc-2026-local-government-manifesto-2026-08-24"
      date: "2026-08-23"
    positions:
      lgbtq:
        summary: "Manifesto names hate crimes against LGBTQI+ people as a safety threat and commits to protecting LGBTQI+ residents."
        quote: "Protect older persons, persons with disabilities, LGBTQI+ and other vulnerable residents by ensuring municipal facilities, public spaces and pedestrian routes are safe and accessible"
        url: "https://www.polity.org.za/article/anc-2026-local-government-manifesto-2026-08-24"
        date: "2026-08-23"
        source_type: "manifesto"
      human_rights:
        summary: "Welcomed the Hate Crimes and Hate Speech Act as strengthening acceptance of diversity."
        quote: "This is an extremely important piece of legislation and one which will further strengthen acceptance of diversity in our country."
        url: "https://politicsweb.co.za/opinion/presidents-assent-to-hate-crimes-act-welcomed--anc"
        date: "2024-05-10"
        source_type: "party_statement"
      israel_palestine:
        summary: "Celebrated the ICJ provisional measures in the genocide case against Israel; supports a free Palestine and a two-state solution."
        quote: "The ICJ’s ruling on provisional measures is a significant victory for humanity and the Palestinian cause."
        url: "https://www.anc1912.org.za/african-national-congress-is-delighted-by-the-icj-judgment-regarding-genocide-in-gaza/"
        date: "2024-01-26"
        source_type: "party_statement"
      policing:
        summary: "SAPS leads policing; municipalities strengthen by-law/metro enforcement, lighting and Community Safety Forums with SAPS and CPFs."
        quote: "Policing remains primarily the responsibility of SAPS, but local government has a real role to play"
        url: "https://www.polity.org.za/article/anc-2026-local-government-manifesto-2026-08-24"
        date: "2026-08-23"
        source_type: "manifesto"
      housing_land:
        summary: "Upgrade informal settlements, expand serviced sites, facilitate title deeds and social housing, reverse apartheid spatial patterns."
        quote: "facilitating title deed transfers and supporting affordable and social housing"
        url: "https://www.polity.org.za/article/anc-2026-local-government-manifesto-2026-08-24"
        date: "2026-08-23"
        source_type: "manifesto"
      immigration:
        summary: "Enforce immigration and labour laws with Home Affairs; subsidised housing for qualifying South Africans; regulate trading permits."
        quote: "Government-subsidised housing will be allocated to qualifying South Africans in accordance with the law, while trading spaces and permits are properly regulated."
        url: "https://www.polity.org.za/article/anc-2026-local-government-manifesto-2026-08-24"
        date: "2026-08-23"
        source_type: "manifesto"

  - name: "Economic Freedom Fighters"
    website: "https://effonline.org"
    manifesto:
      title: "EFF Local Government Elections Manifesto 2026 (Victory or Death!)"
      url: "https://www.polity.org.za/article/eff-local-government-elections-manifesto-2026-2026-09-15"
      date: "2026-07-25"   # launched Thohoyandou Stadium; also on effonline.org (blocks automated access)
      election: "2026 local"
    priorities:
      - text: "Municipalities acquire land for residential, commercial and agricultural use; stop selling municipal land."
        url: "https://www.polity.org.za/article/eff-local-government-elections-manifesto-2026-2026-09-15"
      - text: "Insource security, cleaning, waste collection and maintenance to create permanent municipal jobs."
        url: "https://www.polity.org.za/article/eff-local-government-elections-manifesto-2026-2026-09-15"
      - text: "Increase free basic water and electricity allocations and introduce progressive tariff structures."
        url: "https://www.polity.org.za/article/eff-local-government-elections-manifesto-2026-2026-09-15"
      - text: "Fight crime and corruption with stronger municipal law enforcement and hotspot-based strategies with SAPS."
        url: "https://www.polity.org.za/article/eff-local-government-elections-manifesto-2026-2026-09-15"
      - text: "Gender equality, safety and social programmes, including protection for vulnerable groups."
        url: "https://www.polity.org.za/article/eff-local-government-elections-manifesto-2026-2026-09-15"
    economy:
      summary: "Insourcing over outsourcing, progressive tariffs, larger free basic services, expropriation of abandoned land and no sale of municipal land."
      url: "https://www.polity.org.za/article/eff-local-government-elections-manifesto-2026-2026-09-15"
      date: "2026-07-25"
    positions:
      lgbtq:
        summary: "Manifesto commits to protect the rights and dignity of LGBTQIA+ persons and sex workers through inclusive municipal services."
        quote: "Protect the rights and dignity of vulnerable groups, including children, senior citizens, LGBTQIA+ persons, and sex workers, through inclusive municipal services and programmes."
        url: "https://www.polity.org.za/article/eff-local-government-elections-manifesto-2026-2026-09-15"
        date: "2026-07-25"
        source_type: "manifesto"
      human_rights:
        found: false
        searched: "2026 manifesto (no civil-liberties section); effonline.org blocks access; news search on EFF free expression/rule of law found only reporting, no checkable quote."
      israel_palestine:
        summary: "Calls for immediate closure of the Israeli embassy per Parliament's 2023 resolution; strongly backs the ICJ case."
        quote: "We further commend the declaration of the Israeli diplomat and call for the president to adhere to the long-standing resolution of parliament to close the Israeli embassy with immediate effect"
        url: "https://ewn.co.za/2026/02/04/eff-renews-call-for-immediate-closure-of-israeli-embassy"
        date: "2026-02-04"
        source_type: "leader_statement"
      policing:
        summary: "Strengthen municipal law enforcement staffing and training; develop hotspot-based crime prevention with SAPS."
        quote: "Work with the South African Police Service and other stakeholders to develop integrated crime prevention strategies based on identified crime hotspots."
        url: "https://www.polity.org.za/article/eff-local-government-elections-manifesto-2026-2026-09-15"
        date: "2026-07-25"
        source_type: "manifesto"
      housing_land:
        summary: "Use municipal expropriation powers on abandoned land and buildings; redistribute municipal land to black communities instead of selling it."
        quote: "Use its expropriation powers to expropriate abandoned land and buildings in order to make these available for use by young people for agriculture and other business activities."
        url: "https://www.polity.org.za/article/eff-local-government-elections-manifesto-2026-2026-09-15"
        date: "2026-07-25"
        source_type: "manifesto"
      immigration:
        summary: "Rejects xenophobia; blames state failure, not African migrants; denies door-to-door campaigns against foreign nationals."
        quote: "We reject xenophobia in all its forms and have consistently maintained that the failures of the South African state cannot be blamed on poor African migrants seeking survival"
        url: "https://allafrica.com/stories/202607030171.html"
        date: "2026-07-02"
        source_type: "party_statement"

  - name: "uMkhonto weSizwe Party"
